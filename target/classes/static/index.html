<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления - Умная Теплица</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .dashboard { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; color: #2c3e50; margin-bottom: 30px; font-size: 32px; }

        /* Сетка для карточек */
        .cards-container { display: flex; gap: 20px; margin-bottom: 30px; }

        /* Дизайн карточек */
        .sensor-card {
            flex: 1; background: white; padding: 25px; border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-temp { border-top: 6px solid #e74c3c; }
        .card-hum { border-top: 6px solid #3498db; }
        .card-light { border-top: 6px solid #f1c40f; }

        .card-title { font-size: 20px; font-weight: 600; color: #7f8c8d; margin-bottom: 10px; margin-top: 0; }
        .value { font-size: 48px; font-weight: bold; margin: 15px 0; }
        .val-temp { color: #e74c3c; }
        .val-hum { color: #3498db; }
        .val-light { color: #f39c12; }

        /* Плашки статусов механизмов */
        .status-badge {
            padding: 10px; border-radius: 8px; font-weight: bold; font-size: 15px; transition: 0.3s;
        }
        .status-off { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-on { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        /* Контейнер графика */
        .chart-container { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="dashboard">
    <h1 class="header">🌿 IoT Панель Умной Теплицы</h1>

    <div class="cards-container">
        <div class="sensor-card card-temp">
            <h3 class="card-title">🌡 Температура</h3>
            <div class="value val-temp" id="tempValue">-- °C</div>
            <div class="status-badge status-off" id="windowStatus">Ожидание...</div>
        </div>

        <div class="sensor-card card-hum">
            <h3 class="card-title">💧 Влажность</h3>
            <div class="value val-hum" id="humValue">-- %</div>
            <div class="status-badge status-off" id="pumpStatus">Ожидание...</div>
        </div>

        <div class="sensor-card card-light">
            <h3 class="card-title">☀️ Освещенность</h3>
            <div class="value val-light" id="lightValue">-- %</div>
            <div class="status-badge status-off" id="lampStatus">Ожидание...</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="tempChart"></canvas>
    </div>
</div>

<script>
    // --- Инициализация графика (только для температуры) ---
    const ctx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'История температуры (°C)',
                data: [],
                borderColor: '#e74c3c',
                backgroundColor: 'rgba(231, 76, 60, 0.1)',
                borderWidth: 3,
                tension: 0.4,
                fill: true
            }]
        },
        options: { responsive: true, scales: { y: { suggestedMin: 15, suggestedMax: 35 } } }
    });

    // --- Глобальные переменные состояний (как в Java) ---
    let isWindowOpen = false;
    let isPumpOn = false;
    let isLampOn = false;

    // --- Основная функция ---
    async function fetchSensorData() {
        try {
            const response = await fetch('/api/greenhouse/current');
            const sensors = await response.json();

            if (sensors && sensors.length > 0) {
                // Разбираем массив датчиков по их ID
                sensors.forEach(sensor => {
                    if (sensor.id === 'temp_sensor_1') {
                        const t = sensor.val;
                        document.getElementById('tempValue').innerText = t.toFixed(1) + ' °C';

                        // Логика Окна
                        if (t > 30) isWindowOpen = true;
                        if (t < 22) isWindowOpen = false;

                        const wBadge = document.getElementById('windowStatus');
                        wBadge.innerText = isWindowOpen ? '💨 ОКНО ОТКРЫТО' : '🚪 ОКНО ЗАКРЫТО';
                        wBadge.className = isWindowOpen ? 'status-badge status-on' : 'status-badge status-off';

                        // Добавляем точку на график
                        const now = new Date();
                        const timeString = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
                        tempChart.data.labels.push(timeString);
                        tempChart.data.datasets[0].data.push(t);
                        if (tempChart.data.labels.length > 20) {
                            tempChart.data.labels.shift();
                            tempChart.data.datasets[0].data.shift();
                        }
                        tempChart.update();
                    }
                    else if (sensor.id === 'hum_sensor_1') {
                        const h = sensor.val;
                        document.getElementById('humValue').innerText = h.toFixed(1) + ' %';

                        // Логика Помпы
                        if (h < 40) isPumpOn = true;
                        if (h > 60) isPumpOn = false;

                        const pBadge = document.getElementById('pumpStatus');
                        pBadge.innerText = isPumpOn ? '💧 ПОМПА РАБОТАЕТ' : '🛑 ПОМПА ВЫКЛЮЧЕНА';
                        pBadge.className = isPumpOn ? 'status-badge status-on' : 'status-badge status-off';
                    }
                    else if (sensor.id === 'light_sensor_1') {
                        const l = sensor.val;
                        document.getElementById('lightValue').innerText = Math.round(l) + ' %';

                        // Логика Лампы
                        if (l < 30) isLampOn = true;
                        if (l > 70) isLampOn = false;

                        const lBadge = document.getElementById('lampStatus');
                        lBadge.innerText = isLampOn ? '💡 ЛАМПА ГОРИТ' : '🌑 ЛАМПА ПОГАСШЕНА';
                        lBadge.className = isLampOn ? 'status-badge status-on' : 'status-badge status-off';
                    }
                });
            }
        } catch (error) {
            console.error("Ошибка связи с сервером:", error);
        }
    }

    // Запрашиваем данные каждую секунду
    setInterval(fetchSensorData, 1000);
    fetchSensorData();
</script>
</body>
</html>
